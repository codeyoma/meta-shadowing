name: MetaShadowingNative
options:
  deploymentTarget:
    iOS: '26.0'
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  AppleServices:
    path: Packages/AppleServices
  LearningDomain:
    path: Packages/LearningDomain
  AppFoundation:
    path: Packages/AppFoundation
  LearningMedia:
    path: Packages/LearningMedia
  LearningPersistence:
    path: Packages/LearningPersistence
  LearningReference:
    path: Packages/LearningReference
targets:
  NativeStoreKitFixtureSetup:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StoreKitFixtureSetup
      - path: Tests/AppleServiceIntegrationTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MetaShadowingNative
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NATIVE_APP_BUNDLE_IDENTIFIER).storekitsetup
  NativeAppleServiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppleServiceIntegrationTests
        excludes: [Fixtures]
      - path: Tests/AppleServiceIntegrationTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MetaShadowingNative
      - package: AppleServices
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NATIVE_APP_BUNDLE_IDENTIFIER).servicetests
  MetaShadowingNative:
    type: application
    platform: iOS
    postBuildScripts:
      - name: Prepare optional internal video
        script: '/usr/bin/env -u SDKROOT /usr/bin/xcrun --sdk macosx swift "$SRCROOT/scripts/copy-local-video.swift"'
        basedOnDependencyAnalysis: false
    sources:
      - path: App
      - path: ../assets/sample
        type: folder
        buildPhase: resources
      - path: ../assets/illustrations/morning-notes.png
        buildPhase: resources
      - path: ../assets/brand/talking-pup-512.webp
        buildPhase: resources
      - path: ../assets/brand/talking-pup-still.png
        buildPhase: resources
      - path: ../assets/brand/launch-wordmark.png
        buildPhase: resources
    dependencies:
      - package: AppleServices
      - package: LearningDomain
      - package: AppFoundation
      - package: LearningMedia
      - package: LearningPersistence
      - package: LearningReference
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Debug.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NATIVE_APP_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
        INFOPLIST_KEY_CFBundleDisplayName: 쉐도잉 Native
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 유선 헤드폰으로 내 목소리를 실시간 모니터링합니다. 녹음하거나 전송하지 않습니다.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Generated/Info.plist
      properties:
        UIBackgroundModes: [audio]
  NativeMediaIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/MediaIntegrationTests]
    dependencies:
      - package: AppleServices
      - target: MetaShadowingNative
      - package: LearningMedia
      - package: LearningDomain
      - package: AppFoundation
      - package: LearningPersistence
      - package: LearningReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NATIVE_APP_BUNDLE_IDENTIFIER).mediatests
  NativeFoundationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AppUITests
      - path: Tests/AppleServiceIntegrationTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MetaShadowingNative
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NATIVE_APP_BUNDLE_IDENTIFIER).uitests
schemes:
  StoreKitFixtureSetup:
    build:
      targets:
        MetaShadowingNative: all
        NativeStoreKitFixtureSetup: [test]
    test:
      targets: [NativeStoreKitFixtureSetup]
  MetaShadowingNative:
    build:
      targets:
        MetaShadowingNative: all
        NativeFoundationUITests: [test]
        NativeMediaIntegrationTests: [test]
        NativeAppleServiceTests: [test]
    test:
      targets: [NativeFoundationUITests, NativeMediaIntegrationTests, NativeAppleServiceTests]
