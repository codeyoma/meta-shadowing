# Disposable local integration stack only; never copy over a developer's config.
project_id = "meta-shadowing-browser-tests"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3010/auth/confirm"]
enable_signup = false
[auth.email]
# Local tests create users with the Admin API, then mint trusted Google claims.
# This does not enable public signup or change production's Google-only policy.
enable_signup = true
[auth.rate_limit]
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000
[storage]
enabled = true
file_size_limit = "50MiB"
[studio]
enabled = false
[analytics]
enabled = false
[inbucket]
enabled = true
port = 54324
