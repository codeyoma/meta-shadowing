name: Close completed issues after dev merge

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  close-completed-issues:
    if: github.repository == 'codeyoma/meta-shadowing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      # A push checks out reviewed, merged dev code, never a PR head or PR body.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/close-merged-issues.test.mjs
      - name: Close issues explicitly resolved by merged feature PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/close-merged-issues.mjs
