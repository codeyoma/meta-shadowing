name: Swift CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  ci-branch-policy:
    name: ci-branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/check-branch-policy.test.mjs
      - run: node scripts/check-branch-policy.mjs < "$GITHUB_EVENT_PATH"

  ci-quality:
    name: ci-quality
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          command -v rg || brew install ripgrep
          command -v jq || brew install jq
      - name: Test learning domain
        run: swift test --package-path native-ios/Packages/LearningDomain
      - name: Test app foundation
        run: swift test --package-path native-ios/Packages/AppFoundation
      - name: Test transactional learning storage
        run: swift test --package-path native-ios/Packages/LearningPersistence
      - name: Test native media policies and feedback
        run: swift test --package-path native-ios/Packages/LearningMedia
      - name: Reference tools tests
        run: swift test --package-path native-ios/Packages/LearningReference
      - name: Apple service contracts and recovery tests
        run: swift test --package-path native-ios/Packages/AppleServices
      - name: Internal video build boundary
        run: swift native-ios/scripts/copy-local-video.swift --self-test
      - name: Offline acceptance runner failure and isolation contract
        run: bash native-ios/scripts/test-offline-acceptance-runner.sh
      - name: Native test shard coverage and failure contract
        run: bash native-ios/scripts/test-ci-test-shards.sh

  ci-native-test-shards:
    name: Native tests (${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [player, product, remaining]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      CI_TEST_SHARD: ${{ matrix.shard }}
      CI_PLAYER_TEST_CLASS: NativeFoundationUITests/PlayerUITests
      CI_PRODUCT_TEST_CLASSES: >-
        NativeFoundationUITests/ProductUITests
        NativeFoundationUITests/AppleServicesUITests
        NativeFoundationUITests/VoiceOverSemanticsUITests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate standalone Swift app
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcodegen --version
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory bytes: $(sysctl -n hw.memsize)"
          xcodegen generate --spec native-ios/project-ci.yml
      - name: Wait for iOS 27 Simulator readiness
        id: simulator
        timeout-minutes: 5
        run: |
          ci_simulator=$(xcrun simctl list devices available --json | jq -r --arg runtime "$IOS_TEST_RUNTIME" '[.devices[$runtime][]? | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty')
          test -n "$ci_simulator" || { echo 'Required iOS 27.0 iPhone Simulator is unavailable.' >&2; exit 1; }
          echo "::add-mask::$ci_simulator"
          xcrun simctl bootstatus "$ci_simulator" -b > "$RUNNER_TEMP/native-simulator-boot.log" 2>&1
          echo "id=$ci_simulator" >> "$GITHUB_OUTPUT"
          echo 'Required iOS 27.0 Simulator finished booting.'
      - name: Build native test products
        timeout-minutes: 15
        env:
          CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          # Build the complete free-product test graph; no purchase setup process.
          xcodebuild build-for-testing -project native-ios/MetaShadowingNative.xcodeproj \
            -scheme MetaShadowingNative -configuration Debug \
            -destination "platform=iOS Simulator,id=$CI_SIMULATOR,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/native-ui-build" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 |
            awk -f native-ios/scripts/ci-build-progress.awk
      - name: Verify isolated app launch before XCTest
        timeout-minutes: 3
        env:
          CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          ci_app="$RUNNER_TEMP/native-ui-build/Build/Products/Debug-iphonesimulator/MetaShadowingNative.app"
          ci_profile=$(uuidgen)
          xcrun simctl install "$CI_SIMULATOR" "$ci_app" > "$RUNNER_TEMP/native-ui-install.log" 2>&1
          xcrun simctl launch --terminate-running-process "$CI_SIMULATOR" com.example.metashadowing.ci \
            --ui-test-product --ui-test-probe-id "$ci_profile" > "$RUNNER_TEMP/native-ui-preflight.log" 2>&1
          echo 'Isolated CI app launched before XCTest.'
      - name: Test native UI and actual media adapters on iOS 27
        timeout-minutes: 30
        env:
          CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          # Named UI groups and their exact complement cover the full scheme once.
          read -r -a ci_product_classes <<< "$CI_PRODUCT_TEST_CLASSES"
          test "${#ci_product_classes[@]}" -gt 0
          ci_selection=()
          case "$CI_TEST_SHARD" in
            player) ci_selection=("-only-testing:$CI_PLAYER_TEST_CLASS") ;;
            product)
              for ci_test_class in "${ci_product_classes[@]}"; do
                ci_selection+=("-only-testing:$ci_test_class")
              done ;;
            remaining)
              ci_selection=("-skip-testing:$CI_PLAYER_TEST_CLASS")
              for ci_test_class in "${ci_product_classes[@]}"; do
                ci_selection+=("-skip-testing:$ci_test_class")
              done ;;
            *) echo 'Unknown native test shard.' >&2; exit 1 ;;
          esac
          xcodebuild test-without-building -project native-ios/MetaShadowingNative.xcodeproj \
            -scheme MetaShadowingNative -configuration Debug \
            -destination "platform=iOS Simulator,id=$CI_SIMULATOR,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/native-ui-build" \
            -parallel-testing-enabled NO "${ci_selection[@]}" \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/native-ui.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 |
            awk '
              /^Test Case / && / (started|passed|failed)[ .]/ { print; fflush() }
              /^Test case / && / (passed|failed) on / {
                # Xcode may interleave diagnostics inside the destination suffix.
                sub(/ on .*/, ""); print; fflush()
              }
              /^\*\* TEST/ { print; fflush() }
            '
      - name: Report UI test results without account or device metadata
        if: always()
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/native-ui.xcresult/Info.plist" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/native-ui.xcresult" |
              jq '{result, totalTestCount, passedTests, failedTests, skippedTests, testFailures}' > "$RUNNER_TEMP/native-ui-summary.json"
            cat "$RUNNER_TEMP/native-ui-summary.json"
            # The summary includes only the first assertion per failed test.
            # Export all assertion messages, never device metadata or source locations.
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/native-ui.xcresult" |
              jq '[.testNodes[] | .. | objects | select(.nodeType? == "Test Case")] as $tests |
                [$tests[] | select(.result == "Failed") |
                  {test: .nodeIdentifier, durationInSeconds,
                   failures: [.. | objects | select(.nodeType? == "Failure Message") | .name]}],
                ($tests | map({test: .nodeIdentifier, result, durationInSeconds}) |
                  sort_by(.durationInSeconds // 0) | reverse | .[:10])'
            jq -e '.result == "Passed" and .totalTestCount > 0 and
              .passedTests == .totalTestCount and .failedTests == 0 and .skippedTests == 0' \
              "$RUNNER_TEMP/native-ui-summary.json" > /dev/null
          else
            echo 'No finalized XCTest result bundle; the test command did not finish.'
            exit 1
          fi

  ci-native-tests:
    name: ci-native-tests
    if: always()
    needs: [ci-native-test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native test shard to pass
        env:
          SHARD_RESULT: ${{ needs.ci-native-test-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo 'Native tests require every shard to succeed.' >&2
            exit 1
          fi
          echo 'All native test shards passed.'

  ci-ios-build:
    name: ci-ios-build
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare native build tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v rg || brew install ripgrep
          xcodebuild -version
          xcodegen --version
      - name: Verify clean-checkout CI configuration
        run: |
          bash native-ios/scripts/test-ci-build-progress.sh
          bash native-ios/scripts/test-ci-configuration.sh
      - name: Verify service configuration and exact entitlement policy
        run: swift native-ios/scripts/configure-apple-services.swift --self-test
      - name: Build fictional managed downloader without account access
        run: bash native-ios/scripts/test-service-build.sh
      - name: Generate standalone Swift app
        run: xcodegen generate --spec native-ios/project-ci.yml
      - name: Build and inspect Debug and Release without signing credentials
        run: |
          for configuration in Debug Release; do
            xcodebuild build -project native-ios/MetaShadowingNative.xcodeproj \
              -scheme MetaShadowingNative -configuration "$configuration" \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/native-build" CODE_SIGNING_ALLOWED=NO -quiet
            bash native-ios/scripts/verify-native-product.sh \
              "$RUNNER_TEMP/native-build/Build/Products/$configuration-iphonesimulator/MetaShadowingNative.app" "$configuration"
          done

  release-approval:
    name: release-approval
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [ci-branch-policy, ci-quality, ci-native-tests, ci-ios-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    steps:
      - run: echo 'Release candidate approved for merge. This job does not deploy or submit the app.'
