name: Swift CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: Native test scope
        type: choice
        options: [full, light]
        default: full

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  ci-branch-policy:
    name: ci-branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test-scope: ${{ steps.profile.outputs.test-scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test scripts/check-branch-policy.test.mjs
      - run: node scripts/check-branch-policy.mjs < "$GITHUB_EVENT_PATH"
      - run: node --test native-ios/scripts/test-ci-test-profile.mjs
      - name: Select validated native test scope
        id: profile
        run: node native-ios/scripts/ci-test-profile.mjs < "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  ci-quality:
    name: ci-quality
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          command -v rg || brew install ripgrep
          command -v jq || brew install jq
      - name: Internal video build boundary
        run: swift native-ios/scripts/copy-local-video.swift --self-test
      - name: Offline acceptance runner failure and isolation contract
        run: bash native-ios/scripts/test-offline-acceptance-runner.sh
      - name: Native test shard coverage and failure contract
        run: bash native-ios/scripts/test-ci-test-shards.sh
      - name: Exact native test results and local full-suite gate contracts
        run: |
          ruby native-ios/scripts/test-ci-light-workflow.rb
          ruby native-ios/scripts/test-ci-swift-package-tests.rb
          ruby native-ios/scripts/test-native-test-results.rb
          ruby native-ios/scripts/test-native-full-runner.rb
          ruby native-ios/scripts/test-native-pre-push.rb
      - name: Portable native test products contract
        run: bash native-ios/scripts/test-ci-test-products.sh
      - name: Simulator preflight diagnostics contract
        run: |
          bash native-ios/scripts/test-ci-build-progress.sh
          bash native-ios/scripts/test-ci-preflight.sh
          bash native-ios/scripts/test-ci-simulator-resources.sh

  ci-swift-tests:
    name: Swift package logic tests
    needs: [ci-branch-policy]
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run all six Swift package suites
        run: bash native-ios/scripts/ci-swift-package-tests.sh

  ci-native-build:
    name: Build shared native tests
    if: github.event_name == 'workflow_dispatch' && needs.ci-branch-policy.outputs.test-scope == 'full'
    needs: [ci-branch-policy]
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    outputs:
      artifact-id: ${{ steps.products.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate standalone Swift app
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcodegen --version
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "Memory bytes: $(sysctl -n hw.memsize)"
          xcodegen generate --spec native-ios/project-ci.yml
      - name: Build native test products without booting a simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          ci_started=$SECONDS
          echo 'Native build: begin'
          xcodebuild build-for-testing -project native-ios/MetaShadowingNative.xcodeproj \
            -scheme MetaShadowingNative -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath "$RUNNER_TEMP/native-ui-build" \
            -testProductsPath "$RUNNER_TEMP/NativeTests.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 |
            awk -f native-ios/scripts/ci-build-progress.awk
          echo "Native build: elapsed $((SECONDS - ci_started)) seconds"
      - name: Package portable native test products
        run: bash native-ios/scripts/ci-test-products.sh pack "$RUNNER_TEMP" "$RUNNER_TEMP/native-tests.tar"
      - name: Share this run's compiled tests
        id: products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-products-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-tests.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ci-native-test-shards:
    name: Native tests (${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch' && needs.ci-branch-policy.outputs.test-scope == 'full'
    needs: [ci-branch-policy, ci-native-build]
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [player, player-options, product, remaining]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      CI_TEST_SHARD: ${{ matrix.shard }}
      CI_PLAYER_TEST_CLASS: NativeFoundationUITests/PlayerUITests
      CI_OFFLINE_TEST_CLASS: NativeFoundationUITests/OfflineAcceptanceUITests
      CI_PLAYER_OPTIONS_TEST_METHODS: >-
        testAllSentencesSelectsPausedWithoutCredit
        testFailedGroupingEditRetryUpdatesOpenEditor
        testFailedRateEditRetryUpdatesOpenEditor
        testGuideExplainsActiveStageWithoutGrantingCredit
        testOptionsOpensAtFullHeightWithoutAnExpansionGesture
        testOptionsSheetHasOneCloseAndAListExit
        testPlayerOptionsMatchSettingsOrderForAudioAndSilentStages
        testPlayerOptionsSummariesReflectActiveRunAndVideoLayout
        testRevealLevelWaitsForPendingPresetSave
        testSilentSpeedPresetsRequireExplicitRunSelection
        testSubtitleToggleAppearsOnlyForHintStages
        testUngroupedPlayerCanEditGlobalGroupAndRevealPresets
      CI_PRODUCT_TEST_CLASSES: >-
        NativeFoundationUITests/ProductUITests
        NativeFoundationUITests/AppleServicesUITests
        NativeFoundationUITests/VoiceOverSemanticsUITests
      CI_OPTIONS_EXTRA_TESTS: >-
        NativeFoundationUITests/ProductUITests/testLearningSettingsSummariesFollowSavedOptionsAcrossRelaunch
        NativeFoundationUITests/ProductUITests/testFontSettingsPersistAcrossRelaunch
        NativeFoundationUITests/ProductUITests/testRateEditorShowsOnlyLiveValueAndPersistsPreference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's compiled tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.ci-native-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/native-test-artifact
      - name: Validate and restore portable native test products
        run: |
          bash native-ios/scripts/ci-test-products.sh unpack \
            "$RUNNER_TEMP/native-test-artifact/native-tests.tar" "$RUNNER_TEMP/native-tests"
      - name: Prepare iOS 27 Simulator and verify isolated app launch
        id: simulator
        timeout-minutes: 8
        run: |
          ci_simulator=$(xcrun simctl list devices available --json | jq -r --arg runtime "$IOS_TEST_RUNTIME" '[.devices[$runtime][]? | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty')
          test -n "$ci_simulator" || { echo 'Required iOS 27.0 iPhone Simulator is unavailable.' >&2; exit 1; }
          echo "::add-mask::$ci_simulator"
          xcrun simctl bootstatus "$ci_simulator" -b > "$RUNNER_TEMP/native-simulator-boot.log" 2>&1
          ci_app="$RUNNER_TEMP/native-tests/NativeTests.xctestproducts/Binaries/0/Debug-iphonesimulator/MetaShadowingNative.app"
          ci_started=$SECONDS
          echo 'Native preflight: install begin'
          xcrun simctl install "$ci_simulator" "$ci_app" > "$RUNNER_TEMP/native-ui-install.log" 2>&1
          echo "Native preflight: install complete after $((SECONDS - ci_started)) seconds"
          ci_profile=$(uuidgen)
          ci_started=$SECONDS
          echo 'Native preflight: launch begin'
          xcrun simctl launch --terminate-running-process "$ci_simulator" com.example.metashadowing.ci \
            --ui-test-product --ui-test-probe-id "$ci_profile" > "$RUNNER_TEMP/native-ui-preflight.log" 2>&1
          echo "Native preflight: launch complete after $((SECONDS - ci_started)) seconds"
          echo "id=$ci_simulator" >> "$GITHUB_OUTPUT"
          echo 'Isolated CI app launched before XCTest.'
      - name: Test native UI and actual media adapters on iOS 27
        timeout-minutes: 30
        env:
          CI_SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          # Named UI groups and their exact complements cover the full scheme once.
          read -r -a ci_player_option_methods <<< "$CI_PLAYER_OPTIONS_TEST_METHODS"
          test "${#ci_player_option_methods[@]}" -gt 0
          read -r -a ci_product_classes <<< "$CI_PRODUCT_TEST_CLASSES"
          test "${#ci_product_classes[@]}" -gt 0
          read -r -a ci_options_extra <<< "$CI_OPTIONS_EXTRA_TESTS"
          test "${#ci_options_extra[@]}" -gt 0
          ci_selection=()
          case "$CI_TEST_SHARD" in
            player)
              ci_selection=("-only-testing:$CI_PLAYER_TEST_CLASS" "-only-testing:$CI_OFFLINE_TEST_CLASS")
              for ci_test_method in "${ci_player_option_methods[@]}"; do
                ci_selection+=("-skip-testing:$CI_PLAYER_TEST_CLASS/$ci_test_method")
              done ;;
            player-options)
              for ci_test_method in "${ci_player_option_methods[@]}"; do
                ci_selection+=("-only-testing:$CI_PLAYER_TEST_CLASS/$ci_test_method")
              done
              for ci_test in "${ci_options_extra[@]}"; do
                ci_selection+=("-only-testing:$ci_test")
              done ;;
            product)
              for ci_test_class in "${ci_product_classes[@]}"; do
                ci_selection+=("-only-testing:$ci_test_class")
              done
              for ci_test in "${ci_options_extra[@]}"; do
                ci_selection+=("-skip-testing:$ci_test")
              done ;;
            remaining)
              ci_selection=("-skip-testing:$CI_PLAYER_TEST_CLASS" "-skip-testing:$CI_OFFLINE_TEST_CLASS")
              for ci_test_class in "${ci_product_classes[@]}"; do
                ci_selection+=("-skip-testing:$ci_test_class")
              done ;;
            *) echo 'Unknown native test shard.' >&2; exit 1 ;;
          esac
          printf '%s\n' "${ci_selection[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))' \
            > "$RUNNER_TEMP/native-selection.json"
          # Enumerate the complete products; Xcode enumeration is not selection evidence.
          xcodebuild test-without-building \
            -testProductsPath "$RUNNER_TEMP/native-tests/NativeTests.xctestproducts" \
            -destination "platform=iOS Simulator,id=$CI_SIMULATOR,arch=arm64" \
            -parallel-testing-enabled NO -enumerate-tests \
            -test-enumeration-style flat -test-enumeration-format json \
            -test-enumeration-output-path "$RUNNER_TEMP/native-inventory.json" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > "$RUNNER_TEMP/native-enumeration.log" 2>&1
          xcodebuild test-without-building \
            -testProductsPath "$RUNNER_TEMP/native-tests/NativeTests.xctestproducts" \
            -destination "platform=iOS Simulator,id=$CI_SIMULATOR,arch=arm64" \
            -parallel-testing-enabled NO "${ci_selection[@]}" \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/native-ui.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 |
            awk '
              /^Test Case / && / (started|passed|failed)[ .]/ { print; fflush() }
              /^Test case / && / (passed|failed) on / {
                # Xcode may interleave diagnostics inside the destination suffix.
                sub(/ on .*/, ""); print; fflush()
              }
              /^\*\* TEST/ { print; fflush() }
            '
      - name: Report UI test results without account or device metadata
        if: always()
        run: |
          set -o pipefail
          if [ -f "$RUNNER_TEMP/native-ui.xcresult/Info.plist" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/native-ui.xcresult" |
              jq '{result, totalTestCount, passedTests, failedTests, skippedTests, testFailures}' > "$RUNNER_TEMP/native-ui-summary.json"
            cat "$RUNNER_TEMP/native-ui-summary.json"
            # The summary includes only the first assertion per failed test.
            # Export all assertion messages, never device metadata or source locations.
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/native-ui.xcresult" \
              > "$RUNNER_TEMP/native-test-results.json"
            jq '[.testNodes[] | .. | objects | select(.nodeType? == "Test Case")] as $tests |
                [$tests[] | select(.result == "Failed") |
                  {test: .nodeIdentifier, durationInSeconds,
                   failures: [.. | objects | select(.nodeType? == "Failure Message") | .name]}],
                ($tests | map({test: .nodeIdentifier, result, durationInSeconds}) |
                  sort_by(.durationInSeconds // 0) | reverse | .[:10]),
                {executedTests: ($tests | map(.nodeIdentifier) | sort)}' \
              "$RUNNER_TEMP/native-test-results.json"
            ruby native-ios/scripts/validate-native-test-results.rb \
              "$RUNNER_TEMP/native-inventory.json" "$RUNNER_TEMP/native-selection.json" \
              "$RUNNER_TEMP/native-ui-summary.json" "$RUNNER_TEMP/native-test-results.json"
          else
            echo 'No finalized XCTest result bundle; the test command did not finish.'
            exit 1
          fi

  ci-native-tests:
    name: ci-native-tests
    if: always()
    needs: [ci-branch-policy, ci-swift-tests, ci-native-build, ci-native-test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected native checks to pass
        env:
          TEST_SCOPE: ${{ needs.ci-branch-policy.outputs.test-scope }}
          PROFILE_RESULT: ${{ needs.ci-branch-policy.result }}
          HOST_RESULT: ${{ needs.ci-swift-tests.result }}
          BUILD_RESULT: ${{ needs.ci-native-build.result }}
          SHARD_RESULT: ${{ needs.ci-native-test-shards.result }}
        run: |
          if [ "$PROFILE_RESULT" != success ] || [ "$HOST_RESULT" != success ]; then
            echo 'Native tests require validated scope and all six Swift package suites to succeed.' >&2
            exit 1
          fi
          case "$TEST_SCOPE" in
            light)
              test "$BUILD_RESULT" = skipped && test "$SHARD_RESULT" = skipped || {
                echo 'Light scope requires the manual simulator jobs to be skipped.' >&2; exit 1;
              } ;;
            full)
              test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success || {
                echo 'Full scope requires the shared build and every simulator shard to succeed.' >&2; exit 1;
              } ;;
            *) echo 'Unknown or missing native test scope.' >&2; exit 1 ;;
          esac
          echo 'All selected native checks passed.'

  ci-ios-build:
    name: ci-ios-build
    needs: [ci-branch-policy]
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare native build tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v rg || brew install ripgrep
          xcodebuild -version
          xcodegen --version
      - name: Verify clean-checkout CI configuration
        run: |
          bash native-ios/scripts/test-ci-configuration.sh
      - name: Verify service configuration and exact entitlement policy
        run: swift native-ios/scripts/configure-apple-services.swift --self-test
      - name: Build fictional managed downloader without account access
        if: github.event_name == 'workflow_dispatch' && needs.ci-branch-policy.outputs.test-scope == 'full'
        run: bash native-ios/scripts/test-service-build.sh
      - name: Generate standalone Swift app
        run: xcodegen generate --spec native-ios/project-ci.yml
      - name: Build and inspect Debug without signing credentials
        run: |
          xcodebuild build -project native-ios/MetaShadowingNative.xcodeproj \
            -scheme MetaShadowingNative -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/native-build" CODE_SIGNING_ALLOWED=NO -quiet
          bash native-ios/scripts/verify-native-product.sh \
            "$RUNNER_TEMP/native-build/Build/Products/Debug-iphonesimulator/MetaShadowingNative.app" Debug
      - name: Build and inspect Release without signing credentials
        if: github.event_name == 'workflow_dispatch' && needs.ci-branch-policy.outputs.test-scope == 'full'
        run: |
          xcodebuild build -project native-ios/MetaShadowingNative.xcodeproj \
            -scheme MetaShadowingNative -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/native-build" CODE_SIGNING_ALLOWED=NO -quiet
          bash native-ios/scripts/verify-native-product.sh \
            "$RUNNER_TEMP/native-build/Build/Products/Release-iphonesimulator/MetaShadowingNative.app" Release
          bash native-ios/scripts/test-native-runtime-inspection.sh \
            "$RUNNER_TEMP/native-build/Build/Products/Release-iphonesimulator/MetaShadowingNative.app"

  release-approval:
    name: release-approval
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [ci-branch-policy, ci-quality, ci-native-tests, ci-ios-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    steps:
      - run: echo 'Release candidate approved for merge. This job does not deploy or submit the app.'
